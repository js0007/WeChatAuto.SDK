[package]
name = "wechatauto-client"
version = "0.1.0"
edition = "2021"
description = "Auto-generated Rust client SDK for the WECHATAUTO.SDK WeChat automation API."
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
